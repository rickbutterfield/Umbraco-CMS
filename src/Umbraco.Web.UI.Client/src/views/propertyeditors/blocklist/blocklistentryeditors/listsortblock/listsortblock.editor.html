<style>
  @keyframes umb-icon-jump {

    0%,
    100% {
      transform: rotate(6deg);
    }

    50% {
      transform: rotate(-6deg);
    }
  }

  .blockelement-listsortblock-editor .umb-icon {
    animation: umb-icon-jump 1s infinite ease-in-out;
  }

  .blockelement-listsortblock-editor {
    position: relative;
    border-radius: 3px;
    height: 100%;
    /* Add this to fill the cell fully */
    box-sizing: border-box;
    border: 1px solid #E9E9EB;
    background-color: white;
  }

  .blockelement-listsortblock-editor>button {
    position: relative;
    display: flex;
    align-items: center;
    width: 100%;
    min-height: 48px;
    cursor: pointer;
    color: #1b264f;
    background-color: white;
    text-align: left;
    padding: 0 20px;
    user-select: none;
    border: none;
    transition: border-color 120ms, background-color 120ms;
  }

  .blockelement-listsortblock-editor>button:hover {
    color: #2152A3;
  }

  .blockelement-listsortblock-editor .icon {
    font-size: 22px;
    margin-right: 10px;
    display: inline-block;
  }

  .blockelement-listsortblock-editor>button>span {
    position: relative;
    display: inline-block;
    padding-top: 2px;
    padding-bottom: 2px;
  }

  :host {
    --inherited--column-gap: var(--umb-block-list--column-gap, 10px);
    --inherited--row-gap: var(--umb-block-list--row-gap, 10px);
    --inherited--areas-column-gap: var(--umb-block-list--areas-column-gap, 10px);
    --inherited--areas-row-gap: var(--umb-block-list--areas-row-gap, 10px);
  }

  [part='area-container'] {
    box-sizing: border-box;
    padding: 10px;
    --umb-block-list--column-gap: var(--inherited--column-gap, 10px);
    --umb-block-list--row-gap: var(--inherited--row-gap, 10px);
    --umb-block-list--areas-column-gap: var(--inherited--areas-column-gap, 10px);
    --umb-block-list--areas-row-gap: var(--inherited--areas-row-gap, 10px);
  }

</style>

<button
  type="button"
  class="btn-reset umb-outline blockelement-labelblock-editor blockelement-listsortblock-editor blockelement__draggable-element"
  ng-click="block.edit()"
  ng-focus="block.focus"
  ng-class="{ '--active': block.active, '--error': parentForm.$invalid && valFormManager.isShowingValidation() }"
  val-server-property-class="">
    <umb-icon icon="{{block.content.icon}}" class="icon"></umb-icon>
    <span>{{block.label}}</span>
</button>
